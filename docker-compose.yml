version: '3.8'
services:
  frontend:
    build: ./frontend-react
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend-go

  backend-go:
    build: ./backend-go
    ports:
      - "8080:8080"
    environment:
      - PORT=8080

  backend-rust:
    build: ./backend-rust
    ports:
      - "8081:8081"
